name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check the bundled script
        run: bash -n remote-scrcpy.sh

      - name: Rebuild and compare against checked-in bundle
        run: |
          bash src/build.sh /tmp/rebuilt.sh
          diff -u /tmp/rebuilt.sh remote-scrcpy.sh

      - name: Maintenance checks
        run: bash tests/test-maintenance.sh

      - name: Completion checks
        run: bash tests/test-completion.sh

      - name: CLI and UI review checks
        run: bash tests/test-cli-ui-review.sh

      - name: SSH config parser checks
        run: bash tests/test-ssh-config.sh

  # The only end-to-end test of src/transport.sh: the real launcher against a
  # real OpenSSH server and adb client on loopback, with a simulated ADB
  # server and scrcpy. It needs root for its private sshd.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the OpenSSH server and adb
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server adb

      - name: Integration suite
        run: sudo REAL_ADB="$(command -v adb)" python3 tests/test_launcher_integration.py -v
